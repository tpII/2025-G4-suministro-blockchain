<div id="overlay" style="display: none;"></div>

<div class="popup" id="scanner-popup" style="display: none;">
    <div class="popup-2 text-center mt-2">
        <h5 id="popup-title" class="fw-bold text-main mb-2"></h5>
    </div>

    <img src="https://media.geeksforgeeks.org/wp-content/uploads/20210428125647/barcode1-300x158.png"
         style="max-width: 150px; height: auto;" alt="Escaneo">

    <div class="popup-2 text-center mt-2">
        <p id="popup-message" class="text-secondary"></p>
        <div id="tiempo_restante_timeout" class="fw-bold text-main mb-2"></div>
        <button id="cerrarPopupBtn" class="btn btn-sm btn-primary">Cerrar Escáner</button>
    </div>
</div>

<script>
$(document).ready(function() {

   var socket = io.connect('http://' + document.domain + ':' + location.port);
    var popup = $('#scanner-popup');
    var overlay = $('#overlay');
    var popupImg = $('#scanner-popup img');
    var popupTitle = $('#popup-title');
    var popupMessage = $('#popup-message');
    const popupData = {
            rfid: {
                titulo: "Escaneo RFID", 
                mensajes: "💳 Acerque su tarjeta al lector RFID",
                
            },
            dht: {
                titulo: "Lectura Sensor DHT",
                mensajes:"🌡️💧 Obteniendo temperatura y humedad...",
            }
            };
    // Función para mostrar el popup
    function showPopup(tipo) {
        overlay.fadeIn(200);
        popup.fadeIn(200);
        const data = popupData[tipo]
        // Seteamos título y primer mensaje
        popupTitle.text(data.titulo);
        popupMessage.text(data.mensajes);

    }
    // Función para ocultar el popup
    function hidePopup() {
        overlay.fadeOut(200);
        popup.fadeOut(200);
        unsubscribe('rfid');
        socket.emit('rfid_request',{request:'OFF'});
        socket.off('rfid', handleRFIDMessage);
    }
    function subscribe(channel){ socket.emit('subscribe_mqtt_channel',{channel}); }
    function unsubscribe(channel){ socket.emit('unsubscribe_mqtt_channel',{channel}); }
    
    // --- Heartbeat & botones ---
    var timeoutId;
    function disableButton() {
        $('#llenar_boton_rfid').prop('disabled', true);
        $('#llenar_boton_dht').prop('disabled', true);
    }
    timeoutId = setTimeout(disableButton, 1000);
    socket.on('heartbeat', function(data){
        if(data.payload==='A'){
            $('#llenar_boton_rfid, #llenar_boton_dht').prop('disabled', false);
            clearTimeout(timeoutId);
            timeoutId = setTimeout(disableButton, 3000);
        }
    });
    
    // --- Lógica del Botón RFID ---
    function handleRFIDMessage(data){
        $('#rfid_tag').val(data.payload);
        hidePopup(); // Oculta el popup al recibir el dato
    }

    $('#llenar_boton_rfid').click(function(e){
        e.preventDefault();
        showPopup("rfid");
        subscribe('rfid');
        socket.emit('rfid_request',{request:'ON'});
        socket.on('rfid', handleRFIDMessage);
    });
    
    // --- Lógica del Botón DHT ---
    $('#llenar_boton_dht').click(function(e){
        e.preventDefault();
        showPopup("dht")
        // Función de callback para DHT (temperatura)
        function handleTempMessage(d){ 
            $('#temperatura').val(d.payload); 
            unsubscribe('temp'); 
            socket.off('temp', handleTempMessage);
        }
        
        // Función de callback para DHT (humedad)
        function handleHumMessage(d){ 
            $('#humedad').val(d.payload); 
            unsubscribe('hum'); 
            socket.off('hum', handleHumMessage);
        }

        subscribe('temp'); 
        subscribe('hum');
        socket.emit('dht_request',{request:'ON'});
        
        socket.on('temp', handleTempMessage);
        socket.on('hum', handleHumMessage);
        
        // NOTA: Es común que 'dht_request:OFF' se envíe *después* de un breve retraso
        // o después de recibir el primer dato, dependiendo de la implementación del hardware.
        // Aquí lo dejamos al final de la lógica del cliente para simplificar.
        socket.emit('dht_request',{request:'OFF'});
    });

    // --- Botón de Cerrar Popup ---
    $('#cerrarPopupBtn').click(function(){
        hidePopup();
    });

});
</script>
